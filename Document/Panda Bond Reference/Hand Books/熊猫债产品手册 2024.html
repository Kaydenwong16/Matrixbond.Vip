<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊猫债手册</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #525659; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }

  #vg-return-btn {
    position: fixed;
    bottom: 36px;
    right: 36px;
    z-index: 99999;
    background: #16a34a;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 26px;
    border-radius: 50px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 6px 28px rgba(22,163,74,0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  #vg-return-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 10px 40px rgba(22,163,74,0.75);
  }
  #vg-return-btn .vg-btn-icon { font-size: 20px; line-height: 1; }
  @media (max-width: 600px) {
    #vg-return-btn { bottom: 18px; right: 14px; font-size: 14px; padding: 12px 18px; gap: 8px; }
    #vg-return-btn .vg-btn-icon { font-size: 18px; }
  }

  /* Page-level watermark, on top of the iframe. This is in addition
     to the logo watermark already baked into the PDF pages
     themselves; pointer-events:none so it never blocks clicks/scroll
     into the PDF viewer underneath. */
  .vg-watermark {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background-image: url('../../../Matrix Logo MBM rem bckgd.png');
    background-repeat: repeat;
    background-position: center;
    background-size: 180px auto;
    opacity: 0.06;
  }
</style>
</head>
<body oncontextmenu="return false;">

<iframe src="熊猫债产品手册 2024.pdf" title="熊猫债手册"></iframe>
<div class="vg-watermark"></div>

<a id="vg-return-btn" href="../../../faqs.html">
  <span class="vg-btn-icon">🏠</span>
  <span id="vg-return-btn-text">返回 Matrix Bond</span>
</a>
<script>
(function () {
  var lang = 'en';
  try { lang = localStorage.getItem('vg_lang') || 'en'; } catch (e) {}
  var el = document.getElementById('vg-return-btn-text');
  if (el) el.textContent = lang === 'en' ? 'Return to Matrix Bond' : '返回 Matrix Bond';
})();
</script>

<!-- Best-effort download/print/drag deterrents. These only catch the
     shortcut when focus is on this wrapper page itself — once focus
     moves inside the browser's native PDF viewer (the iframe content),
     the parent page's JS can no longer intercept key events, so this
     is not a hard block. -->
<script>
document.addEventListener('keydown', function (e) {
  var key = (e.key || '').toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (key === 's' || key === 'p')) {
    e.preventDefault();
  }
});
document.addEventListener('dragstart', function (e) { e.preventDefault(); });
</script>

</body>
</html>
