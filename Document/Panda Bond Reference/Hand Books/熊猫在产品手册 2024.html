<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊猫债手册</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #525659; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }

  #vg-return-btn {
    position: fixed;
    bottom: 36px;
    right: 36px;
    z-index: 99999;
    background: #16a34a;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 26px;
    border-radius: 50px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 6px 28px rgba(22,163,74,0.5);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  #vg-return-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 10px 40px rgba(22,163,74,0.75);
  }
  #vg-return-btn .vg-btn-icon { font-size: 20px; line-height: 1; }
  @media (max-width: 600px) {
    #vg-return-btn { bottom: 18px; right: 14px; font-size: 14px; padding: 12px 18px; gap: 8px; }
    #vg-return-btn .vg-btn-icon { font-size: 18px; }
  }
</style>
</head>
<body oncontextmenu="return false;">

<!-- ========== SECURITY GATE ========== -->
<style>
body.vg-locked > *:not(#vg-security-gate) { visibility: hidden !important; pointer-events: none !important; }
#vg-security-gate {
  position: fixed; inset: 0; z-index: 999999;
  background: linear-gradient(160deg, #0b2440 0%, #123a63 55%, #1b4d80 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
}
#vg-security-gate .gate-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(184,148,74,0.35);
  border-radius: 18px;
  padding: 52px 44px;
  text-align: center;
  max-width: 420px;
  width: 90%;
  backdrop-filter: blur(12px);
}
#vg-security-gate .gate-logo { font-size: 46px; margin-bottom: 10px; }
#vg-security-gate .gate-title {
  color: #b8944a; font-size: 21px; font-weight: 800;
  letter-spacing: 2px; margin-bottom: 8px;
}
#vg-security-gate .gate-subtitle {
  color: rgba(255,255,255,0.5); font-size: 13px;
  line-height: 1.7; margin-bottom: 36px;
}
#vg-security-gate .gate-label {
  color: rgba(255,255,255,0.65); font-size: 12px;
  text-align: left; margin-bottom: 10px; letter-spacing: 0.5px;
}
#vg-security-gate input {
  width: 100%; padding: 16px 18px;
  border-radius: 10px;
  border: 1.5px solid rgba(184,148,74,0.4);
  background: rgba(255,255,255,0.07);
  color: #fff; font-size: 26px;
  letter-spacing: 10px; text-align: center;
  outline: none; margin-bottom: 18px;
  transition: border-color 0.2s;
}
#vg-security-gate input:focus { border-color: #b8944a; }
#vg-security-gate input.vg-gate-shake {
  border-color: #e74c3c !important;
  animation: gate-shake 0.35s ease;
}
#vg-security-gate button {
  width: 100%; padding: 15px;
  border-radius: 10px; background: #b8944a;
  color: #0b2440; font-size: 16px; font-weight: 800;
  border: none; cursor: pointer; letter-spacing: 1px;
  transition: background 0.2s, transform 0.1s;
}
#vg-security-gate button:hover { background: #d9b96a; transform: scale(1.02); }
#vg-security-gate button.gate-cancel {
  background: transparent;
  color: rgba(255,255,255,0.55);
  border: 1.5px solid rgba(255,255,255,0.25);
  font-size: 14px;
  font-weight: 600;
  margin-top: 10px;
}
#vg-security-gate button.gate-cancel:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.45);
  color: #fff;
  transform: none;
}
#vg-security-gate .gate-error {
  color: #ff6b6b; font-size: 13px;
  margin-top: 14px; min-height: 18px;
}
@keyframes gate-shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-10px); }
  75%      { transform: translateX(10px); }
}
@media (max-width: 480px) {
  #vg-security-gate .gate-box { padding: 32px 22px; }
  #vg-security-gate .gate-title { font-size: 18px; }
  #vg-security-gate input { font-size: 20px; letter-spacing: 6px; padding: 14px 10px; }
}
</style>

<div id="vg-security-gate">
  <div class="gate-box">
    <div class="gate-logo">🔒</div>
    <div class="gate-title">Matrix Bond Management</div>
    <div class="gate-subtitle" id="vg-gate-subtitle">机密文件 — 请输入安全码</div>
    <div class="gate-label" id="vg-gate-label">安全码</div>
    <input type="password" id="vg-gate-input" maxlength="6" placeholder="······" autocomplete="off" inputmode="numeric">
    <button onclick="vgGateSubmit()" id="vg-gate-enter">确认</button>
    <button class="gate-cancel" type="button" id="vg-gate-cancel" onclick="window.location.href='../../../faqs.html'">取消</button>
    <div class="gate-error" id="vg-gate-error"></div>
  </div>
</div>
<script>
(function () {
  var CORRECT = '202605';
  document.body.classList.add('vg-locked');

  var lang = 'zh';
  try { lang = localStorage.getItem('vg_lang') || 'zh'; } catch (e) {}
  if (lang === 'en') {
    document.getElementById('vg-gate-subtitle').textContent = 'Confidential Document — Please Enter Security Code';
    document.getElementById('vg-gate-label').textContent = 'Security Code';
    document.getElementById('vg-gate-enter').textContent = 'Enter';
    document.getElementById('vg-gate-cancel').textContent = 'Cancel';
  }

  document.getElementById('vg-gate-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') vgGateSubmit();
  });
  window.vgGateSubmit = function () {
    var input = document.getElementById('vg-gate-input');
    var errEl = document.getElementById('vg-gate-error');
    if (input.value.trim() === CORRECT) {
      unlock();
    } else {
      input.classList.remove('vg-gate-shake');
      void input.offsetWidth;
      input.classList.add('vg-gate-shake');
      input.value = '';
      errEl.textContent = lang === 'en' ? 'Incorrect code. Please try again.' : '安全码错误，请重试。';
      setTimeout(function () { input.classList.remove('vg-gate-shake'); }, 400);
    }
  };
  function unlock() {
    var gate = document.getElementById('vg-security-gate');
    if (gate) gate.remove();
    document.body.classList.remove('vg-locked');
  }
})();
</script>
<!-- ========== END SECURITY GATE ========== -->

<iframe src="熊猫在产品手册 2024.pdf#toolbar=0" title="熊猫债手册"></iframe>

<a id="vg-return-btn" href="../../../faqs.html">
  <span class="vg-btn-icon">🏠</span>
  <span id="vg-return-btn-text">返回 Matrix Bond</span>
</a>
<script>
(function () {
  var lang = 'en';
  try { lang = localStorage.getItem('vg_lang') || 'en'; } catch (e) {}
  var el = document.getElementById('vg-return-btn-text');
  if (el) el.textContent = lang === 'en' ? 'Return to Matrix Bond' : '返回 Matrix Bond';
})();
</script>

</body>
</html>
